<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Send plan info</title>
<style>
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F7F7F5;color:#1B2A41}
.w{max-width:520px;margin:0 auto;padding:22px 18px 40px}
h1{font-size:1.3rem;margin:0 0 4px}.sub{color:#5B6675;margin:0 0 18px}
a.go{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:16px;color:#fff;text-decoration:none;font-weight:800;font-size:1.2rem;margin:10px 0;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.t{background:linear-gradient(180deg,#22894A,#14592F)}.e{background:linear-gradient(180deg,#2F4A73,#1B2A41)}.g{background:#fff;color:#2F4A73!important;border:2px solid #2F4A73;min-height:52px!important;font-size:1rem!important;box-shadow:none!important}
pre{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid #DDE2E8;border-radius:12px;padding:12px;font:14px/1.45 system-ui,sans-serif;max-height:45vh;overflow:auto}
.n{color:#5B6675;font-size:.9rem}
</style></head><body><div class="w">
<h1 id="h">Send plan info</h1><p class="sub" id="s"></p>
<div id="btns"></div>
<p class="n">Message:</p><pre id="m"></pre>
<p class="n">Nothing is stored here — the message travels inside the link. RGB Insurance.</p>
</div>
<script>
(function(){
  /* #k=sms|mail&s=subject&b=body  (all in the fragment, never sent to the server) */
  var h=new URLSearchParams(location.hash.slice(1)), k=h.get('k')||'mail', s=h.get('s')||'', b=h.get('b')||'', e=encodeURIComponent;
  var iOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var phone=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  document.getElementById('m').textContent=b;
  var sms='sms:'+(iOS?'&':'?')+'body='+e(b);
  var mailto='mailto:?subject='+e(s)+'&body='+e(b).replace(/%0A/g,'%0D%0A');
  var gmail='https://mail.google.com/mail/?view=cm&fs=1&su='+e(s)+'&body='+e(b);
  var B=document.getElementById('btns'), main;
  function btn(cls,href,txt){ var a=document.createElement('a'); a.className='go '+cls; a.href=href; a.textContent=txt; B.appendChild(a); return a; }
  if(k==='sms'){ document.getElementById('h').textContent='Send by text'; document.getElementById('s').textContent='Tap the button, pick the client, press Send.';
    main=btn('t',sms,'💬  Open Messages'); }
  else { document.getElementById('h').textContent='Send by email'; document.getElementById('s').textContent='Tap the button, add the client’s email, press Send.';
    main=btn('e',phone?mailto:gmail,'✉️  Open email'); btn('g',phone?gmail:mailto,phone?'Use Gmail in the browser instead':'Use my computer’s email app instead'); }
  /* try once on arrival; if the phone needs a tap, the big button is right there */
  setTimeout(function(){ try{ location.href=main.href; }catch(x){} },150);
})();
</script>
</body></html>
